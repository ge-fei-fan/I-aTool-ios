name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned app
        run: |
          set -uo pipefail
          xcodebuild -version 2>&1 | tee xcode-version.log
          xcodebuild -list -project Simpanin.xcodeproj 2>&1 | tee xcode-list.log
          xcodebuild \
            -project Simpanin.xcodeproj \
            -scheme Simpanin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bytes=$(wc -c < xcodebuild.log 2>/dev/null || echo 0)
            echo "::error file=.github/workflows/build-trollstore-ipa.yml,line=24::xcodebuild failed with status $status; xcodebuild.log bytes=$bytes"
            tail -80 xcodebuild.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error file=Simpanin.xcodeproj/project.pbxproj,line=1::$line"
            done
            exit "$status"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Simpanin.app"
          test -d "$APP_PATH"
          rm -rf Payload Simpanin-TrollStore.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Simpanin-TrollStore.ipa Payload
          /usr/bin/unzip -l Simpanin-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simpanin-TrollStore
          path: Simpanin-TrollStore.ipa
          if-no-files-found: error
