name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned app
        run: |
          set +e
          xcodebuild -version 2>&1 | tee xcode-version.log
          xcodebuild -list -project Simpanin.xcodeproj 2>&1 | tee xcode-list.log
          xcodebuild \
            -project Simpanin.xcodeproj \
            -scheme Simpanin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-status.txt

      - name: Commit CI diagnostics on failure
        if: always()
        run: |
          set -euo pipefail
          status="$(cat build-status.txt 2>/dev/null || echo 1)"
          if [ "$status" = "0" ]; then
            exit 0
          fi
          mkdir -p ci-diagnostics
          cp xcode-version.log xcode-list.log xcodebuild.log build-status.txt ci-diagnostics/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics
          git commit -m "Add CI diagnostics [skip ci]" || exit 0
          git push

      - name: Fail build if xcodebuild failed
        run: |
          status="$(cat build-status.txt 2>/dev/null || echo 1)"
          exit "$status"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Simpanin.app"
          test -d "$APP_PATH"
          rm -rf Payload Simpanin-TrollStore.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Simpanin-TrollStore.ipa Payload
          /usr/bin/unzip -l Simpanin-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simpanin-TrollStore
          path: Simpanin-TrollStore.ipa
          if-no-files-found: error
